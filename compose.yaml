name: examflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - examflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      target: build
    environment:
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_LECTURER_PASSWORD: ${SEED_LECTURER_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: npm run db:migrate
    restart: "no"

  server:
    build:
      context: ./server
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      CLIENT_URL: http://localhost:8080
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 7
      REFRESH_COOKIE_NAME: examflow_refresh_token
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_LECTURER_PASSWORD: ${SEED_LECTURER_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD}
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
      target: runtime
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  examflow_postgres_data: